<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body>
<div th:fragment="card(entry)" class="entry-card-inner">
  <div class="card-cover">
    <!-- URL externa (TMDB, Google Books, etc.) -->
    <img th:if="${entry.coverPath != null and entry.coverPath.startsWith('http')}"
         th:src="${entry.coverPath}" class="cover-img" alt="portada"/>
    <!-- Fichero local -->
    <img th:if="${entry.coverPath != null and !entry.coverPath.startsWith('http')}"
         th:src="@{/covers/{f}(f=${entry.coverPath})}" class="cover-img" alt="portada"/>
    <span th:if="${entry.coverPath == null}" class="cover-placeholder">📷</span>
  </div>
  <div class="card-info">
    <span class="card-type" th:text="${entry.type}"></span>
    <span class="card-title" th:text="${entry.title}"></span>

    <!-- Libro -->
    <th:block th:if="${entry.type != null and entry.type.contains('Libro')}">
      <span th:if="${entry.author}" class="chip" th:text="'✍️ ' + ${entry.author}"></span>
      <span th:if="${entry.chapters}" class="chip" th:text="'📖 Cap. ' + ${entry.chapters}"></span>
      <span th:if="${entry.finished}" class="chip chip-green">✅ Libro terminado</span>
    </th:block>

    <!-- Serie -->
    <th:block th:if="${entry.type != null and entry.type.contains('Serie')}">
      <span th:if="${entry.season != null and entry.episode != null}" class="chip"
            th:text="'T' + ${entry.season} + ' E' + ${entry.episode}"></span>
      <span th:if="${entry.season != null and entry.episode == null}" class="chip"
            th:text="'T' + ${entry.season}"></span>
      <span th:if="${entry.seasonFinished}" class="chip chip-green">🌟 Fin temporada</span>
      <span th:if="${entry.seriesFinished}" class="chip chip-green">🏆 Serie terminada</span>
    </th:block>

    <!-- Película -->
    <th:block th:if="${entry.type != null and entry.type.contains('Pel')}">
      <span th:if="${entry.director}" class="chip" th:text="'🎬 ' + ${entry.director}"></span>
      <span th:if="${entry.seenInCinema}" class="chip">🎫 Vista en cine</span>
    </th:block>

    <!-- Teatro -->
    <th:block th:if="${entry.type != null and entry.type.contains('Teatro')}">
      <span th:if="${entry.venue}" class="chip" th:text="'🎭 ' + ${entry.venue}"></span>
    </th:block>

    <!-- Cómic -->
    <th:block th:if="${entry.type != null and entry.type.contains('mic')}">
      <!-- Tomo único -->
      <th:block th:if="${entry.isSingleVolume}">
        <span class="chip">Tomo único</span>
        <span th:if="${entry.comicIssue}" class="chip" th:text="'#' + ${entry.comicIssue}"></span>
        <span th:if="${entry.finished}" class="chip chip-green">✅ Tomo terminado</span>
      </th:block>
      <!-- Tomo numerado -->
      <th:block th:unless="${entry.isSingleVolume}">
        <span th:if="${entry.comicVolume}" class="chip" th:text="'📕 Tomo ' + ${entry.comicVolume}"></span>
        <span th:if="${entry.comicIssue}"  class="chip" th:text="'#' + ${entry.comicIssue}"></span>
        <span th:if="${entry.finished}"       class="chip chip-green">✅ Tomo terminado</span>
        <span th:if="${entry.seriesFinished}" class="chip chip-green">🏆 Serie terminada</span>
      </th:block>
    </th:block>

    <span class="chip" th:text="'📅 ' + ${entry.date}"></span>

    <!-- Estrellas -->
    <div th:if="${entry.rating != null and entry.rating > 0}" class="stars-row">
      <th:block th:each="i : ${#numbers.sequence(1, 10)}">
        <span th:text="${i <= entry.rating ? '★' : '☆'}" th:class="${i <= entry.rating ? 'star on' : 'star'}"></span>
      </th:block>
      <span class="rating-label" th:text="${entry.rating} + '/10'"></span>
    </div>

    <p th:if="${entry.description}" class="card-desc" th:text="${entry.description}"></p>
  </div>
  <div class="card-actions">
    <a th:href="@{/editar/{id}(id=${entry.id})}" class="btn-icon" title="Editar">✏️</a>
    <form th:action="@{/eliminar/{id}(id=${entry.id})}" method="post" onsubmit="return confirm('¿Eliminar este registro?')">
      <button type="submit" class="btn-icon" title="Eliminar">🗑️</button>
    </form>
  </div>
</div>
</body>
</html>
