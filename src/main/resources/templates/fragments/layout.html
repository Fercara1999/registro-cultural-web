<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)" lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${title} + ' | Mi Registro Cultural'">Mi Registro Cultural</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">📚 Mi Registro Cultural</div>
    <div class="nav-links">
      <a th:href="@{/}"           th:classappend="${#httpServletRequest.requestURI == '/'           ? 'active' : ''}">📝 Registrar</a>
      <a th:href="@{/buscar}"     th:classappend="${#httpServletRequest.requestURI.startsWith('/buscar')     ? 'active' : ''}">🔍 Buscar</a>
      <a th:href="@{/estadisticas}" th:classappend="${#httpServletRequest.requestURI.startsWith('/estadisticas') ? 'active' : ''}">📊 Estadísticas</a>
    </div>
    <button class="theme-btn" onclick="toggleTheme()">🌙</button>
  </nav>

  <main class="main-content">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>
    <th:block th:replace="${content}"/>
  </main>

  <script th:src="@{/js/app.js}"></script>
</body>
</html>
