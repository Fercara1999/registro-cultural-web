<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Detalle | Mi Registro Cultural</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav class="navbar">
  <a th:href="@{/}" class="nav-brand">📚 Mi Registro Cultural</a>
  <div class="nav-links">
    <a th:href="@{/home}">🏠 Inicio</a>
    <a th:href="@{/registrar}">📝 Registrar</a>
    <a th:href="@{/pendientes}">⏳ Pendientes</a>
    <a th:href="@{/buscar}">🔍 Buscar</a>
    <a th:href="@{/estadisticas}" class="active">📊 Estadísticas</a>
    <a th:href="@{/configuracion}">⚙️ Configuración</a>
  </div>
  <button class="theme-btn" onclick="toggleTheme()">🌙</button>
</nav>
<main class="main-content">
  <div class="stats-header" style="margin-bottom:1.5rem;">
    <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;">
      <a th:href="${backUrl}" class="btn btn-secondary">← Volver</a>
      <h2 style="margin:0;" th:text="${detalleTitle}">Detalle</h2>
    </div>
  </div>

  <section class="entries-section">
    <h3>Registros <span class="badge" th:text="${entries.size()}">0</span></h3>
    <div th:if="${entries == null or entries.isEmpty()}" class="empty-msg">
      💭 No hay registros para este filtro en el periodo seleccionado.
    </div>
    <div class="entries-grid" th:if="${entries != null and !entries.isEmpty()}">
      <div th:each="entry : ${entries}" class="entry-card">
        <th:block th:replace="~{fragments/entry-card :: card(${entry})}"/>
      </div>
    </div>
  </section>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
