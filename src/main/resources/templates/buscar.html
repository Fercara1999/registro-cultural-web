<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Buscar | Mi Registro Cultural</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<nav class="navbar">
  <a th:href="@{/}" class="nav-brand">📚 Mi Registro Cultural</a>
  <div class="nav-links">
    <a th:href="@{/home}">🏠 Inicio</a>
    <a th:href="@{/registrar}">📝 Registrar</a>
    <a th:href="@{/pendientes}">⏳ Pendientes</a>
    <a th:href="@{/buscar}" class="active">🔍 Buscar</a>
    <a th:href="@{/estadisticas}">📊 Estadísticas</a>
  </div>
  <button class="theme-btn" onclick="toggleTheme()">🌙</button>
</nav>
<main class="main-content">
  <section class="card form-card">
    <h2>🔍 Buscar registros</h2>
    <form action="/buscar" method="get">
      <div class="form-row">
        <div class="form-group flex-grow">
          <label>Título</label>
          <input type="text" name="title" th:value="${searchTitle}" placeholder="Ej: Breaking Bad"/>
        </div>
        <div class="form-group">
          <label>Tipo</label>
          <select name="type">
            <option value="">Todo</option>
            <option value="Libro" th:selected="${searchType == 'Libro'}">📚 Libro</option>
            <option value="Serie" th:selected="${searchType == 'Serie'}">🎬 Serie</option>
            <option value="Pel" th:selected="${searchType == 'Pel'}">🎥 Película</option>
            <option value="Teatro" th:selected="${searchType == 'Teatro'}">🎭 Teatro</option>
            <option value="mic" th:selected="${searchType == 'mic'}">💭 Cómic</option>
          </select>
        </div>
        <div class="form-group">
          <label>Fecha</label>
          <input type="date" name="date" th:value="${searchDate}"/>
        </div>
        <div class="form-group align-self-end">
          <button type="submit" class="btn btn-primary">🔍 Buscar</button>
        </div>
      </div>
    </form>
  </section>
  <section class="entries-section" th:if="${entries != null}">
    <h2>Resultados <span class="badge" th:text="${entries.size()}">0</span></h2>
    <div class="entries-grid">
      <div th:each="entry : ${entries}" class="entry-card">
        <th:block th:replace="~{fragments/entry-card :: card(${entry})}"/>
      </div>
    </div>
  </section>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
