spring.application.name=registro-cultural-web
server.port=8080

# SQLite - ruta absoluta para persistir en volumen Railway (/app)
spring.datasource.url=jdbc:sqlite:/app/registro_cultural.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Subida de portadas (max 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Directorio de portadas - dentro del volumen
app.covers-dir=/app/covers
