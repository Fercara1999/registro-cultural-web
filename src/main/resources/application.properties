spring.application.name=registro-cultural-web
server.port=8080

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/registro_cultural}

# Subida de portadas (max 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Directorio de portadas
app.covers-dir=${COVERS_DIR:/tmp/covers}

# TMDB
tmdb.bearer-token=${TMDB_BEARER_TOKEN:}
tmdb.api-key=${TMDB_API_KEY:}

# Comic Vine
comicvine.api-key=${COMICVINE_API_KEY:}
comicvine.base-url=https://comicvine.gamespot.com/api
